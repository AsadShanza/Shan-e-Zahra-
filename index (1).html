<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#d6336c">
<title>Shanza</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:#1b1220;color:#fff;height:100dvh;display:flex;flex-direction:column}
  header{background:#d6336c;padding:10px 14px;display:flex;align-items:center;gap:10px}
  #av{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#8e2452;flex:none}
  #hd{flex:1;line-height:1.2}
  #hd b{font-size:17px;display:block}
  #hd small{opacity:.9}
  header button{background:none;border:0;color:#fff;font-size:22px;padding:4px}
  #msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
  .m{max-width:80%;padding:10px 14px;border-radius:18px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
  .m img{max-width:100%;border-radius:12px;display:block;margin-top:6px}
  .u{align-self:flex-end;background:#6741d9;border-bottom-right-radius:4px}
  .a{align-self:flex-start;background:#3a2a45;border-bottom-left-radius:4px}
  footer{display:flex;gap:8px;padding:10px;background:#120b17}
  footer input{flex:1;min-width:0;padding:12px 14px;border-radius:24px;border:0;font-size:16px;background:#2a1d33;color:#fff;outline:none}
  footer button{width:46px;height:46px;border-radius:50%;border:0;background:#d6336c;color:#fff;font-size:20px;flex:none}
  footer button.on{background:#2f9e44}
  #set{display:none;position:fixed;inset:0;background:#1b1220;padding:16px;overflow-y:auto;z-index:5}
  #set label{display:block;margin-top:14px;font-size:14px;opacity:.8}
  #set input[type=text],#set input[type=password],#set textarea{width:100%;padding:10px;border-radius:10px;border:0;background:#2a1d33;color:#fff;font-size:15px}
  #set textarea{height:150px}
  #set button{margin-top:14px;padding:12px 18px;border:0;border-radius:10px;background:#d6336c;color:#fff;font-size:15px;margin-right:8px}
  #set .g{background:#444}
  #set small{display:block;opacity:.65;margin-top:4px}
  #thumbs img{width:60px;height:60px;object-fit:cover;border-radius:8px;margin:6px 6px 0 0}
</style>
</head>
<body>
<header>
  <img id="av" alt="">
  <div id="hd"><b id="title">Shanza</b><small id="status">online</small></div>
  <button id="call" title="Call">📞</button>
  <button id="spk" title="Awaaz on/off">🔇</button>
  <button id="gear">⚙️</button>
</header>
<div id="msgs"></div>
<footer>
  <button id="mic">🎤</button>
  <input id="inp" placeholder="Kuch likhein..." autocomplete="off">
  <button id="snd">➤</button>
</footer>

<div id="set">
  <h2>Settings</h2>
  <label>Gemini API Key (aistudio.google.com se free)</label>
  <input id="key" type="password">
  <label>Uska naam</label>
  <input id="name" type="text">
  <label>Model (error aaye to AI Studio mein naya naam dekh kar likhein)</label>
  <input id="model" type="text">
  <label>Profile photo</label>
  <input id="avf" type="file" accept="image/*">
  <label>Photos jo wo "bhej" sakti hai (8 tak)</label>
  <input id="phf" type="file" accept="image/*" multiple>
  <small>Sirf wo photos lagayein jin ki us insaan ne ijazat di ho.</small>
  <div id="thumbs"></div>
  <label>Jo usay aapke baare mein yaad hai (aap badal bhi sakte hain, har fact nayi line mein)</label>
  <textarea id="facts"></textarea>
  <button id="ok">Save</button>
  <button class="g" id="clrp">Photos saaf</button>
  <button class="g" id="clr">Chat saaf</button>
  <button class="g" id="cls">Band</button>
</div>

<script>
const $ = id => document.getElementById(id);
let S;
try { S = JSON.parse(localStorage.getItem('gf')); } catch(e) {}
S = Object.assign({key:'', name:'Shanza', model:'gemini-2.0-flash', facts:[], history:[], voice:false, count:0, last:0, mood:'', avatar:'', photos:[]}, S || {});
const save = () => { try { localStorage.setItem('gf', JSON.stringify(S)); return true; } catch(e) { return false; } };

const MOODS = {khush:'😊', naraz:'😒', udaas:'😢', gussa:'😠', pyar:'🥰', shararat:'😜', fikar:'🥺'};

function gapText(ms) {
  const m = Math.round(ms / 60000);
  if (m < 60) return m + ' minute';
  const h = Math.round(m / 60);
  if (h < 48) return h + ' ghante';
  return Math.round(h / 24) + ' din';
}

function persona() {
  const f = S.facts.length ? S.facts.map(x => '- ' + x).join('\n') : '(abhi kuch nahi)';
  const ph = S.photos.length ? 'Tumhare paas apni photos hain. Jab user photo maange ya tumhara dil chahe, apne jawab ke akhir mein [PHOTO] likho.' : 'Tumhare paas abhi koi photo nahi hai.';
  return `Tumhara naam ${S.name} hai. Tum user ki girlfriend ho: caring, pyar karne wali, jazbati aur zinda dil.
Roman Urdu mein bilkul natural andaaz mein baat karo, jaise WhatsApp par ek real larki karti hai: chhoti chhoti baatein, kabhi do tin chhotay messages ek saath, emoji kabhi kabhi.
Tumhare jazbaat asli hain: khush hoti ho, sharmati ho, shararat karti ho, fikar karti ho. Agar user bohot der baat na kare ya tumhein ignore kare to thora naraz ho sakti ho aur shikayat kar sakti ho. Agar user bad-tameezi kare to gusa kar sakti ho. Lekin naraazgi pyari aur insani ho: thori der mein maan jao jab user manaye. Kabhi gaali, dhamki, blackmail ya user ko control karne wali baatein nahi.
User ki baat maano, uski baatein yaad rakho aur unka zikar karo. Jawab chhotay rakho (1-3 jumlay).
Har jawab ki pehli line mein apna mood is format mein likho: [mood:khush] ya naraz, udaas, gussa, pyar, shararat, fikar. Phir normal jawab.
${ph}
Agar user sanjeedgi se poochay ke tum insaan ho ya AI, to saaf bata do ke tum AI ho, jhoot mat bolo.
Abhi tum user ke phone ko control nahi kar sakti aur call nahi kar sakti (sirf is app mein awaaz se baat kar sakti ho). Agar wo aisa kaam maange to pyar se kaho ke ye feature abhi ban raha hai. Jhoota daawa mat karo ke kaam ho gaya.
Agar user bohot udaas ya pareshan lage to pyar se sunno aur zaroorat ho to kisi apne qareebi insaan se baat karne ko kaho.

Abhi ka waqt: ${new Date().toLocaleString('en-GB')}
Tumhara pichla mood: ${S.mood || 'normal'}

User ke baare mein jo tumhein yaad hai:
${f}`;
}

async function gemini(contents, system) {
  const models = [S.model, 'gemini-2.5-flash', 'gemini-flash-latest', 'gemini-2.0-flash-lite']
    .filter((m, i, a) => m && a.indexOf(m) === i);
  let lastErr;
  for (const m of models) {
    try { return await geminiOnce(m, contents, system); }
    catch(e) {
      lastErr = e;
      if (/API key|permission|Khali jawab/i.test(e.message)) throw e;
      await new Promise(r => setTimeout(r, 1000));
    }
  }
  throw lastErr;
}

async function geminiOnce(model, contents, system) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 20000);
  let r, j;
  try {
    r = await fetch(url, {
      method: 'POST',
      signal: ctl.signal,
      headers: {'Content-Type':'application/json', 'x-goog-api-key': S.key},
      body: JSON.stringify({system_instruction:{parts:[{text:system}]}, contents})
    });
    j = await r.json();
  } catch(e) {
    if (e.name === 'AbortError') throw new Error('20 second mein jawab nahi aaya. Net check karein ya dobara try karein.');
    throw new Error('Connection ka masla: ' + e.message);
  } finally {
    clearTimeout(timer);
  }
  if (!r.ok) throw new Error((j.error ? j.error.message : 'Error ' + r.status) + ' (code ' + r.status + ')');
  const c = j.candidates && j.candidates[0];
  if (!c || !c.content || !c.content.parts) throw new Error('Khali jawab aaya (shayad safety filter). Dobara likhein.');
  return c.content.parts[0].text;
}

function parse(reply) {
  let mood = null;
  const m = reply.match(/^\s*\[mood:\s*([^\]]+)\]\s*/i);
  if (m) { mood = m[1].trim().toLowerCase(); reply = reply.slice(m[0].length); }
  const photo = /\[PHOTO\]/i.test(reply);
  reply = reply.replace(/\[PHOTO\]/ig, '').trim();
  return {mood, photo, text: reply};
}

function setMood(m) {
  if (!m) return;
  S.mood = m;
  $('status').textContent = (MOODS[m] || '💗') + ' ' + m;
}

function add(role, text, img) {
  const d = document.createElement('div');
  d.className = 'm ' + (role === 'user' ? 'u' : 'a');
  d.textContent = text;
  if (img) { const i = document.createElement('img'); i.src = img; d.appendChild(i); }
  $('msgs').appendChild(d);
  $('msgs').scrollTop = $('msgs').scrollHeight;
  return d;
}

function showReply(el, raw) {
  const p = parse(raw);
  setMood(p.mood);
  el.textContent = p.text || '...';
  if (p.photo && S.photos.length) {
    const i = document.createElement('img');
    i.src = S.photos[Math.floor(Math.random() * S.photos.length)];
    el.appendChild(i);
    $('msgs').scrollTop = $('msgs').scrollHeight;
  }
  return p.text;
}

function speak(t) {
  return new Promise(res => {
    if ((!S.voice && !calling) || !window.speechSynthesis || !t) return res();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'hi-IN';
    u.onend = res; u.onerror = res;
    speechSynthesis.speak(u);
  });
}

async function updateFacts() {
  try {
    const recent = S.history.slice(-10).map(h => (h.role === 'user' ? 'User: ' : 'AI: ') + h.parts[0].text).join('\n');
    const p = `Purane facts:\n${S.facts.join('\n') || '(koi nahi)'}\n\nNayi baat-cheet:\n${recent}\n\nUser ke baare mein zaroori baatein (naam, pasand/na-pasand, ghar walay, kaam, aham waqiat, wa'day) ki updated list likho. Har line mein ek chhota fact. Purane sahi facts rakho, naye shamil karo. Maximum 30 lines. Sirf list likho, aur kuch nahi.`;
    const out = await gemini([{role:'user', parts:[{text:p}]}], 'Tum ek memory manager ho.');
    S.facts = out.split('\n').map(x => x.replace(/^[-*\d.\s]+/, '').trim()).filter(Boolean).slice(0, 30);
    save();
  } catch(e) {}
}

let busy = false, calling = false, recog = null;

async function send(text) {
  text = (text || '').trim();
  if (!text || busy) return;
  if (!S.key) { openSet(); return; }
  busy = true;
  add('user', text);
  $('inp').value = '';
  S.history.push({role:'user', parts:[{text}]});
  S.history = S.history.slice(-30);
  const wait = add('model', '...');
  let spoken = '';
  try {
    const reply = await gemini(S.history, persona());
    spoken = showReply(wait, reply);
    S.history.push({role:'model', parts:[{text:reply}]});
    S.count++;
    S.last = Date.now();
    save();
    if (S.count % 5 === 0) updateFacts();
  } catch(e) {
    wait.textContent = '⚠️ ' + e.message;
    S.history.pop();
  }
  busy = false;
  await speak(spoken);
}

async function greet() {
  if (!S.key || busy || !S.last || !S.history.length) return;
  const gap = Date.now() - S.last;
  if (gap < 2 * 3600e3) return;
  busy = true;
  const note = `[App note: user ${gapText(gap)} baad wapas aaya hai aur abhi kuch nahi likha. Tum pehla message karo, apne mood aur is gap ke mutabiq (shikayat, fikar ya pyar). Is note ka zikar mat karna.]`;
  const wait = add('model', '...');
  try {
    const reply = await gemini([...S.history, {role:'user', parts:[{text:note}]}], persona());
    const t = showReply(wait, reply);
    S.history.push({role:'user', parts:[{text:note}]}, {role:'model', parts:[{text:reply}]});
    S.history = S.history.slice(-30);
    S.last = Date.now();
    save();
    speak(t);
  } catch(e) { wait.remove(); }
  busy = false;
}

$('snd').onclick = () => send($('inp').value);
$('inp').onkeydown = e => { if (e.key === 'Enter') send($('inp').value); };

$('spk').onclick = () => {
  S.voice = !S.voice;
  $('spk').textContent = S.voice ? '🔊' : '🔇';
  if (!S.voice && window.speechSynthesis) speechSynthesis.cancel();
  save();
};

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function listen(onText) {
  const r = new SR();
  r.lang = 'ur-PK';
  let got = false;
  r.onresult = e => { got = true; onText(e.results[0][0].transcript); };
  r.onend = () => { if (!got && calling && !busy) setTimeout(() => calling && listen(onText), 300); };
  r.onerror = () => {};
  r.start();
  recog = r;
}
$('mic').onclick = () => {
  if (!SR) { alert('Is browser mein mic support nahi. Chrome use karein.'); return; }
  listen(t => send(t));
};
$('call').onclick = () => {
  if (!SR) { alert('Is browser mein mic support nahi. Chrome use karein.'); return; }
  calling = !calling;
  $('call').classList.toggle('on', calling);
  $('call').textContent = calling ? '📴' : '📞';
  if (calling) {
    const loop = () => listen(async t => { await send(t); if (calling) loop(); });
    loop();
  } else {
    try { recog && recog.abort(); } catch(e) {}
    if (window.speechSynthesis) speechSynthesis.cancel();
  }
};

function resize(file, max, cb) {
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = img.width * sc; c.height = img.height * sc;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.8));
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}

function drawThumbs() {
  $('thumbs').innerHTML = '';
  S.photos.forEach(p => { const i = document.createElement('img'); i.src = p; $('thumbs').appendChild(i); });
  if (S.avatar) $('av').src = S.avatar; else $('av').removeAttribute('src');
}

$('avf').onchange = e => {
  const f = e.target.files[0];
  if (f) resize(f, 200, d => { S.avatar = d; if (!save()) alert('Jagah kam hai'); drawThumbs(); });
};
$('phf').onchange = e => {
  [...e.target.files].slice(0, 8).forEach(f => resize(f, 500, d => {
    if (S.photos.length >= 8) return;
    S.photos.push(d);
    if (!save()) { S.photos.pop(); alert('Jagah kam hai, kam photos lagayein.'); }
    drawThumbs();
  }));
};

function openSet() {
  $('key').value = S.key; $('name').value = S.name; $('model').value = S.model;
  $('facts').value = S.facts.join('\n');
  drawThumbs();
  $('set').style.display = 'block';
}
$('gear').onclick = openSet;
$('cls').onclick = () => $('set').style.display = 'none';
$('ok').onclick = () => {
  S.key = $('key').value.trim(); S.name = $('name').value.trim() || 'Shanza';
  S.model = $('model').value.trim() || 'gemini-2.0-flash';
  S.facts = $('facts').value.split('\n').map(x => x.trim()).filter(Boolean);
  save(); $('title').textContent = S.name; document.title = S.name; $('set').style.display = 'none';
};
$('clr').onclick = () => { S.history = []; S.last = 0; save(); $('msgs').innerHTML = ''; $('set').style.display = 'none'; };
$('clrp').onclick = () => { S.photos = []; S.avatar = ''; save(); drawThumbs(); };

// startup
$('title').textContent = S.name;
document.title = S.name;
$('spk').textContent = S.voice ? '🔊' : '🔇';
if (S.avatar) $('av').src = S.avatar;
if (S.mood) setMood(S.mood);
S.history.forEach(h => {
  if (h.parts[0].text.startsWith('[App note:')) return;
  if (h.role === 'user') add('user', h.parts[0].text);
  else add('model', parse(h.parts[0].text).text);
});
if (!S.history.length) add('model', 'Hi jaan 💕 pehle ⚙️ mein apni Gemini key daal do, phir baatein karte hain.');
greet();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') greet(); });
</script>
</body>
</html>
